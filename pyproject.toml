[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "autobench"
version = "0.1.0"
description = "Continuous, scheduler-backed benchmark coverage for project workspaces"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.optional-dependencies]
source-trace = ["project-source"]
scheduler = ["device-scheduler-mcp"]
examples = ["numpy>=2.0"]
test = ["pytest>=8"]

[project.scripts]
autobench = "autobench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/autobench/examples/cellerator-sparse-support/scripts" = ["examples/cellerator-sparse-support/scripts/*.py"]
"share/autobench/examples/cellerator-sparse-support/build" = ["examples/cellerator-sparse-support/build/*"]
"share/autobench/examples/cellerator-sparse-support" = ["examples/cellerator-sparse-support/registration.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

